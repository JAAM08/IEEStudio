[package]
name = "voltforge-report"
description = "Memoria de cálculo de VoltForge en PDF."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"

[dependencies]
voltforge-core = { path = "../voltforge-core" }
voltforge-project = { path = "../voltforge-project" }
typst-as-lib = "0.17"
typst-pdf = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
