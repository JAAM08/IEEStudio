[package]
name = "voltforge-exchange"
description = "Intercambio de datos de VoltForge con otros programas: el cuadro de cargas en Excel."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[dependencies]
voltforge-core = { path = "../voltforge-core" }
voltforge-rules = { path = "../voltforge-rules" }
voltforge-project = { path = "../voltforge-project" }
rust_xlsxwriter = { version = "0.99.1", default-features = false }
calamine = { version = "0.36.1", default-features = false }

[dev-dependencies]
rust_xlsxwriter = { version = "0.99.1", default-features = false }
