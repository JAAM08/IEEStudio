[package]
name = "ieestudio-project"
description = "Modelo del proyecto de IEEStudio: tableros, circuitos y cuadro de cargas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ieestudio-core = { path = "../ieestudio-core", features = ["serde"] }
ieestudio-electrical = { path = "../ieestudio-electrical", features = ["serde"] }
ieestudio-rules = { path = "../ieestudio-rules", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
