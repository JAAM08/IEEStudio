[package]
name = "ieestudio-app"
description = "Aplicación de escritorio de IEEStudio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.95"

[[bin]]
name = "ieestudio-app"
path = "src/main.rs"

[dependencies]
ieestudio-core = { path = "../ieestudio-core" }
ieestudio-rules = { path = "../ieestudio-rules" }
ieestudio-project = { path = "../ieestudio-project" }
ieestudio-diagrams = { path = "../ieestudio-diagrams" }
ieestudio-reports = { path = "../ieestudio-reports" }
ieestudio-exchange = { path = "../ieestudio-exchange" }
eframe = { version = "0.36", features = ["persistence", "glow"] }
egui_extras = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui-phosphor = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "File", "FileList", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlInputElement", "Url", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"

[build-dependencies]
winresource = "0.1"
