[package]
name = "voltforge-cli"
description = "Línea de comandos de VoltForge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.95"

[[bin]]
name = "voltforge"
path = "src/main.rs"

[dependencies]
voltforge-core = { path = "../voltforge-core" }
voltforge-project = { path = "../voltforge-project" }
voltforge-report = { path = "../voltforge-report" }
serde_json = "1"
