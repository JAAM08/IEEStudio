[package]
name = "voltforge-project"
description = "Modelo del proyecto de VoltForge: tableros, circuitos y cuadro de cargas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
voltforge-core = { path = "../voltforge-core", features = ["serde"] }
voltforge-electrical = { path = "../voltforge-electrical", features = ["serde"] }
voltforge-rules = { path = "../voltforge-rules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
