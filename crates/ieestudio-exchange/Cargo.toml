[package]
name = "ieestudio-exchange"
description = "Intercambio de datos de IEEStudio con otros programas: el cuadro de cargas en Excel."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[dependencies]
ieestudio-core = { path = "../ieestudio-core" }
ieestudio-rules = { path = "../ieestudio-rules" }
ieestudio-project = { path = "../ieestudio-project" }
rust_xlsxwriter = { version = "0.99.1", default-features = false }
calamine = { version = "0.36.1", default-features = false }

[dev-dependencies]
rust_xlsxwriter = { version = "0.99.1", default-features = false }

# En el navegador, la fecha del libro se toma de JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rust_xlsxwriter = { version = "0.99.1", default-features = false, features = ["wasm"] }
