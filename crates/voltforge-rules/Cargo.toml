[package]
name = "voltforge-rules"
description = "Perfiles normativos de VoltForge: tablas y referencias"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `serde` permite entregar las referencias en JSON.
serde = ["dep:serde", "voltforge-core/serde"]

[dependencies]
voltforge-core = { path = "../voltforge-core" }
serde = { version = "1", features = ["derive"], optional = true }
