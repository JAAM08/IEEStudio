[package]
name = "voltforge-app"
description = "Aplicación de escritorio de VoltForge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.95"

[[bin]]
name = "voltforge-app"
path = "src/main.rs"

[dependencies]
voltforge-core = { path = "../voltforge-core" }
voltforge-project = { path = "../voltforge-project" }
voltforge-report = { path = "../voltforge-report" }
eframe = "0.36"
egui_extras = "0.36"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
