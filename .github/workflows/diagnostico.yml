name: Diagnóstico en Windows

# Abre el programa con ventana de la versión publicada en una máquina Windows
# limpia, para saber si se puede probar ahí que abre. No compila nada.
on:
  push:
    branches: [diagnostico-windows]
  workflow_dispatch:

jobs:
  abrir:
    runs-on: windows-latest
    steps:
      - name: Abrir el programa con ventana
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38593047189 -n ieestudio-windows -R ${{ github.repository }} -D app
          Get-ChildItem app | Format-Table Name, Length
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process "$PWD\app\ieestudio-app.exe" -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          "terminó: $($p.HasExited)"
          if ($p.HasExited) { "Código de salida: 0x{0:X8}" -f $p.ExitCode }
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\pantalla.png")
          "--- registro de errores"
          Get-Content "$env:LOCALAPPDATA\IEEStudio\registro-errores.txt" -ErrorAction SilentlyContinue
          if (-not $p.HasExited) { Stop-Process -Id $p.Id }
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: diagnostico-ventana
          path: pantalla.png
