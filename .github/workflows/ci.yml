name: CI

on:
  push:
    branches: [main]
    # Una etiqueta v* publica una versión con el instalador.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Análisis estático
        run: cargo clippy --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test
      - name: Compilar los ejecutables
        run: cargo build --release -p voltforge-cli -p voltforge-app
      - name: Instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'voltforge-app').version
          # Windows pide la versión en cuatro números: 0.2.0-alpha.1 → 0.2.0.1
          $base = ($version -split '-')[0]
          $build = if ($version -match '-.*\.(\d+)$') { $Matches[1] } else { '0' }
          & $iscc "/DAppVersion=$version" "/DAppVersionNum=$base.$build" installer\voltforge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar el ejecutable de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voltforge-windows
          path: |
            target/release/voltforge.exe
            target/release/voltforge-app.exe
      - name: Publicar el instalador de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voltforge-instalador
          path: target/installer/*.exe
      - name: Crear la versión en GitHub
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag (Get-ChildItem target\installer\*.exe).FullName `
            --title "VoltForge $($tag.TrimStart('v'))" --prerelease `
            --notes "Versión alfa. Descarga el instalador, ábrelo y sigue el asistente. Windows puede mostrar «Windows protegió su PC» porque el instalador no está firmado: elige «Más información» y luego «Ejecutar de todos modos»."
      - name: Publicar el ejecutable de Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: voltforge-linux
          path: |
            target/release/voltforge
            target/release/voltforge-app
