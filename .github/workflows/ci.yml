name: CI

on:
  push:
    branches: [main]
    # Una etiqueta v* publica una versión con el instalador.
    tags: ["v*"]
  pull_request:
  # Desde la pestaña Actions, «Run workflow» vuelve a publicar ieestudio.com.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Análisis estático
        run: cargo clippy --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test
      - name: Compilar los ejecutables
        run: cargo build --release -p ieestudio-cli -p ieestudio-app
      - name: Instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($meta.packages | Where-Object name -eq 'ieestudio-app').version
          # Windows pide la versión en cuatro números: 0.2.0-alpha.1 → 0.2.0.1
          $base = ($version -split '-')[0]
          $build = if ($version -match '-.*\.(\d+)$') { $Matches[1] } else { '0' }
          & $iscc "/DAppVersion=$version" "/DAppVersionNum=$base.$build" installer\ieestudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Probar el instalador
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Instala como lo haría un usuario y comprueba que el programa abre.
          # Así se descubrió que la línea de comandos se escribía encima del
          # programa con ventana (Windows no distingue mayúsculas).
          $dir = "$env:RUNNER_TEMP\IEEStudio"
          $setup = (Get-ChildItem target\installer\*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir" -Wait
          Get-ChildItem $dir | Format-Table Name, Length
          function Subsistema($ruta) {
            $b = [System.IO.File]::ReadAllBytes($ruta)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          }
          $app = Join-Path $dir 'IEEStudio.exe'
          $cli = Join-Path $dir 'ieestudio-cli.exe'
          if (-not (Test-Path $app) -or -not (Test-Path $cli)) { throw "Faltan IEEStudio.exe o ieestudio-cli.exe" }
          if ((Subsistema $app) -ne 2) { throw "IEEStudio.exe no es el programa con ventana" }
          if ((Subsistema $cli) -ne 3) { throw "ieestudio-cli.exe no es la línea de comandos" }
          & $cli ejemplo "$env:RUNNER_TEMP\prueba.iees"
          if ($LASTEXITCODE -ne 0) { throw "La línea de comandos falló" }
          $log = "$env:LOCALAPPDATA\IEEStudio\registro-errores.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process $app -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          if (Test-Path $log) { Get-Content $log; throw "El programa registró un error al abrir" }
          if ($p.HasExited) { throw ("El programa se cerró solo (código 0x{0:X8})" -f $p.ExitCode) }
          Stop-Process -Id $p.Id
          "El programa abrió y siguió abierto."
      - name: Publicar el ejecutable de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ieestudio-windows
          path: |
            target/release/ieestudio.exe
            target/release/ieestudio-app.exe
      - name: Publicar el instalador de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: ieestudio-instalador
          path: target/installer/*.exe
      - name: Crear la versión en GitHub
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem target\installer\*.exe).FullName
          # Si la versión ya se creó desde la página de GitHub, solo se le
          # agrega el instalador.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files `
              --title "IEEStudio $($tag.TrimStart('v'))" --prerelease `
              --notes "Versión alfa. Descarga el instalador, ábrelo y sigue el asistente. Windows puede mostrar «Windows protegió su PC» porque el instalador no está firmado: elige «Más información» y luego «Ejecutar de todos modos»."
          }
      - name: Publicar el ejecutable de Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: ieestudio-linux
          path: |
            target/release/ieestudio
            target/release/ieestudio-app

  web:
    name: Sitio y aplicación web
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Análisis estático para el navegador
        run: cargo clippy --target wasm32-unknown-unknown -p ieestudio-app -- -D warnings
      - name: Herramientas de WebAssembly
        run: |
          # wasm-bindgen-cli debe ser de la misma versión que el crate.
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$version"; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - name: Armar el sitio
        run: tools/sitio-web.sh
      - name: Publicar el sitio
        uses: actions/upload-artifact@v5
        with:
          name: ieestudio-sitio
          path: target/sitio
          include-hidden-files: true
      - name: Preparar ieestudio.com para GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/sitio
      - name: Agregar el sitio a la versión en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          zip="IEEStudio-${tag#v}-sitio-web.zip"
          (cd target/sitio && zip -qr "../$zip" .)
          gh release upload "$tag" "target/$zip" --clobber

  pages:
    name: Publicar ieestudio.com
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Mientras GitHub Pages no esté activado en el repositorio, este paso
    # falla sin marcar en rojo lo demás.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
