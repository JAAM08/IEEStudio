name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Análisis estático
        run: cargo clippy --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test
      - name: Compilar la línea de comandos
        run: cargo build --release -p voltforge-cli
      - name: Publicar el ejecutable de Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: voltforge-windows
          path: target/release/voltforge.exe
      - name: Publicar el ejecutable de Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: voltforge-linux
          path: target/release/voltforge
