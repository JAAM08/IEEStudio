[workspace]
resolver = "2"
members = ["crates/ieestudio-core", "crates/ieestudio-rules", "crates/ieestudio-electrical", "crates/ieestudio-project", "crates/ieestudio-cli", "crates/ieestudio-app", "crates/ieestudio-diagrams", "crates/ieestudio-reports", "crates/ieestudio-exchange"]

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JAAM08/ieestudio"
rust-version = "1.80"

# Ejecutable de distribución: sin símbolos de depuración y con optimización
# entre crates. «thin» y no «fat»: con typst, «fat» tarda demasiado en enlazar.
[profile.release]
lto = "thin"
strip = true
panic = "abort"

# Las dependencias sin información de depuración: compila más rápido y ocupa
# mucho menos disco. El código propio la conserva.
[profile.dev.package."*"]
debug = false
